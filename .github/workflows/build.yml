name: Build iOS App

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest

    - name: Package App Bundle
      run: |
        mkdir -p Payload/LeanIPTV.app
        
        # Compile direct Swift source into an executable binary
        swiftc ContentView.swift LeanIPTVApp.swift -o Payload/LeanIPTV.app/LeanIPTV -target arm64-apple-ios15.0 -sdk $(xcrun --show-sdk-path)
        
        # Generate Info.plist for AltStore
        cat << 'EOF' > Payload/LeanIPTV.app/Info.plist
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleIdentifier</key>
            <string>com.lean.iptv</string>
            <key>CFBundleName</key>
            <string>LeanIPTV</string>
            <key>CFBundleExecutable</key>
            <string>LeanIPTV</string>
            <key>CFBundleVersion</key>
            <string>1.0</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>MinimumOSVersion</key>
            <string>15.0</string>
            <key>UIDeviceFamily</key>
            <array>
                <integer>1</integer>
                <integer>2</integer>
            </array>
        </dict>
        </plist>
        EOF

        # Create IPA package
        zip -r LeanIPTV.app.ipa Payload
        
    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LeanIPTV-IPA
        path: LeanIPTV.app.ipa
