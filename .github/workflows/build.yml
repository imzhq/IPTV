name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Generate project and install VLC
      run: |
        xcodegen generate
        pod install

    - name: Build app (unsigned)
      run: |
        xcodebuild \
          -workspace LeanIPTV.xcworkspace \
          -scheme LeanIPTV \
          -configuration Release \
          -sdk iphoneos \
          -destination 'generic/platform=iOS' \
          -derivedDataPath build \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          build

    - name: Package IPA
      run: |
        mkdir -p Payload
        cp -R build/Build/Products/Release-iphoneos/LeanIPTV.app Payload/
        zip -r LeanIPTV.app.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LeanIPTV-IPA
        path: LeanIPTV.app.ipa
