name: Build iOS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project LeanIPTV.xcodeproj \
            -scheme LeanIPTV

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project LeanIPTV.xcodeproj \
            -scheme LeanIPTV \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/LeanIPTV.app Payload/
          zip -r LeanIPTV.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LeanIPTV-ipa
          path: LeanIPTV.ipa
