name: LeanIPTV
options:
  bundleIdPrefix: com.lean
  deploymentTarget:
    iOS: "15.0"
targets:
  LeanIPTV:
    type: application
    platform: iOS
    sources:
      - path: ContentView.swift
      - path: LeanIPTVApp.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lean.iptv
        PRODUCT_NAME: LeanIPTV
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: GeneratedInfo.plist
      properties:
        CFBundleDisplayName: LeanIPTV
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
