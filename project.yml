name: LeanIPTV
options:
  bundleIdPrefix: com.lean
  deploymentTarget:
    iOS: "15.0"
packages:
  KSPlayer:
    url: https://github.com/kingslay/KSPlayer.git
    from: 2.0.0 # Or whichever latest stable release version you prefer
targets:
  LeanIPTV:
    type: application
    platform: iOS
    sources:
      - path: ContentView.swift
      - path: LeanIPTVApp.swift
    dependencies:
      - package: KSPlayer
        product: KSPlayer
      # Note: Include MobileVLCKit here if your live TV view requires it via SPM or cocoapods
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lean.iptv
        PRODUCT_NAME: LeanIPTV
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: GeneratedInfo.plist
      properties:
        CFBundleDisplayName: LeanIPTV
        UILaunchScreen: {}
        UIBackgroundModes: 
          - audio
          - fetch
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
